name: Deploy

# The interface deploys itself: Vercel builds every push, configured by
# vercel.json rather than by dashboard settings. This workflow covers the two
# things Vercel does not — the database schema and the Edge Function.
#
# Both branches, because dev had neither. Its schema and its function were
# whatever somebody last pushed by hand, which is how it ended up running an
# API from before a week of work: every report of "it still does not work on
# dev" was that, and no amount of testing here could have found it.
#
# It is *called* by the checks workflow rather than triggered beside it, so a
# deploy cannot begin until they have passed. It was briefly hung off
# `workflow_run` instead, which waits correctly but runs against the *default
# branch's* ref whatever branch was pushed — and an environment restricted to
# `dev` can never match a run whose ref is `main`, so dev deploys would have
# been refused by their own protection rule. Being called keeps the run on the
# branch it is about, which is what those rules are written against.
#
# The two credentials carry two different jobs on purpose, each able to do only
# its own:
#
#   SUPABASE_DB_URL        a Postgres connection string. `db push` talks to the
#                          database directly, so migrations need no Supabase
#                          account and no Management API access at all — the
#                          credential that touches the data cannot deploy, and
#                          reaches exactly one database.
#   SUPABASE_ACCESS_TOKEN  a token belonging to a Supabase account that exists
#                          only for this, holding the **Developer** role. That
#                          role may update Edge Functions and may not change
#                          project settings, billing, members, or the
#                          organisation. A token can never do more than the
#                          account behind it, so the account is where this is
#                          limited.
#
# One human owner's token would do both — and would carry every permission on
# every project that person can reach, now and in future. Nothing here needs
# that, so nothing here is given it.
#
# Each environment holds its own pair, and each is restricted to the one branch
# that deploys it: development to dev, production to main.
on:
  # The ordinary path: the checks workflow calls this once they have passed.
  workflow_call:
  # And by hand, to redeploy what is already on a branch.
  workflow_dispatch:

# One deploy at a time per branch, and never cancelled half way: a migration
# interrupted between two statements is the one thing here that cannot be
# retried out of.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  # What is being deployed, whether it is worth deploying, and where to.
  #
  # Every other job reads its answers, so the branch-to-project mapping and the
  # "has this actually changed" question are each decided once.
  plan:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      schema: ${{ steps.changed.outputs.schema }}
      function: ${{ steps.changed.outputs.function }}
    steps:
      - id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=development" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          # Two commits, so the push can be compared with what came before it.
          # On a merge commit HEAD^ is the first parent, which makes the
          # comparison "everything this merge brought in" rather than "what the
          # last commit on the branch happened to touch".
          fetch-depth: 2

      # Deploying what did not change costs a function version and a cold start
      # for nothing. A hand-run deploy always goes ahead: somebody asking for
      # one by name is usually asking precisely because the last one is in
      # doubt.
      - id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::notice::Asked for by hand; deploying both regardless of the diff."
            echo "schema=true" >> "$GITHUB_OUTPUT"
            echo "function=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # No parent to compare against — the first commit on a branch — means
          # nothing is known to be unchanged.
          if ! git rev-parse --verify --quiet HEAD^ >/dev/null; then
            echo "::notice::No parent commit to compare; deploying both."
            echo "schema=true" >> "$GITHUB_OUTPUT"
            echo "function=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed() { ! git diff --quiet HEAD^ HEAD -- "$1"; }
          if changed supabase/migrations; then
            echo "schema=true" >> "$GITHUB_OUTPUT"
          else
            echo "schema=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No migrations changed."
          fi
          # The committed bundle is the build of services/api/src — the stale
          # check below is what makes that true — so an unchanged bundle is
          # proof the API itself did not change.
          if changed supabase/functions/api/index.js; then
            echo "function=true" >> "$GITHUB_OUTPUT"
          else
            echo "function=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The Edge Function bundle is unchanged."
          fi

  # The artifact is committed, and the function is deployed by pinning its
  # commit. A drift here means a branch would deploy code that is not in it.
  bundle:
    name: The bundle is the source
    needs: plan
    if: needs.plan.outputs.function == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:api
      - name: Refuse to deploy a stale bundle
        run: |
          if ! git diff --quiet -- supabase/functions/api/index.js; then
            echo "::error::The committed bundle is not the build of services/api/src."
            exit 1
          fi

  # Schema before code: a function calling a column that does not exist yet is
  # the one ordering that breaks, and it breaks for real users.
  migrations:
    name: Schema
    needs: plan
    if: needs.plan.outputs.schema == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.plan.outputs.environment }}
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for the connection string
        id: credentials
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No SUPABASE_DB_URL; skipping the migrations."
          fi
      - uses: supabase/setup-cli@v1
        if: steps.credentials.outputs.present == 'true'
        with:
          version: latest
      # Straight to the database, with no Management API in the path — which is
      # why this needs no access token and can reach nothing but this schema.
      # Give it the session-mode pooler string: runners are IPv4, and a
      # project's direct host may not be.
      - name: Apply migrations
        if: steps.credentials.outputs.present == 'true'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all

  functions:
    name: Edge Function
    needs: [plan, bundle, migrations]
    # `always()` because either of the two before it may legitimately be
    # skipped — a push that changes only the schema, or only the code. What
    # must not be tolerated is one of them having *failed*.
    if: >-
      always()
      && needs.plan.outputs.function == 'true'
      && needs.bundle.result == 'success'
      && needs.migrations.result != 'failure'
      && needs.migrations.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: ${{ needs.plan.outputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: >-
        ${{ vars.SUPABASE_PROJECT_REF
            || (github.ref_name == 'main' && 'kbybnveitlxkffqptvqm'
                                          || 'rhwkoodeeqyuwfymxwqa') }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for the token
        id: credentials
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No SUPABASE_ACCESS_TOKEN; skipping the Edge Function."
          fi
      - uses: supabase/setup-cli@v1
        if: steps.credentials.outputs.present == 'true'
        with:
          version: latest
      - name: Deploy
        if: steps.credentials.outputs.present == 'true'
        # ADR 0004 and ADR 0007: the function authenticates its own callers, so
        # the platform's JWT gate is off and this flag is deliberate.
        run: supabase functions deploy api --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
      - name: Check it answers
        if: steps.credentials.outputs.present == 'true'
        run: |
          for attempt in $(seq 1 20); do
            if curl -sf "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/api/health"; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::The deployed function did not answer /health."
          exit 1
