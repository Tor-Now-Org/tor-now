name: Deploy

# The interface deploys itself: Vercel builds every push, configured by
# vercel.json rather than by dashboard settings. This workflow covers the two
# things Vercel does not — the database schema and the Edge Function.
#
# Both branches, because dev had neither. Its schema and its function were
# whatever somebody last pushed by hand, which is how it ended up running an
# API from before a week of work: every report of "it still does not work on
# dev" was that, and no amount of testing here could have found it.
#
# The two steps carry two different credentials on purpose, each able to do
# only its own job:
#
#   SUPABASE_DB_URL        a Postgres connection string. `db push` talks to the
#                          database directly, so migrations need no Supabase
#                          account and no Management API access at all — the
#                          credential that touches the data cannot deploy, and
#                          reaches exactly one database.
#   SUPABASE_ACCESS_TOKEN  a token belonging to a Supabase account that exists
#                          only for this, holding the **Developer** role. That
#                          role may update Edge Functions and may not change
#                          project settings, billing, members, or the
#                          organisation. A token can never do more than the
#                          account behind it, so the account is where this is
#                          limited.
#
# One human owner's token would do both — and would carry every permission on
# every project that person can reach, now and in future. Nothing here needs
# that, so nothing here is given it.
#
# Two tightenings are worth taking when they become available: project-scoped
# roles (Team plan) confine the CI account to one project, and scoped personal
# access tokens narrow a token to Edge Functions alone. Neither exists on this
# organisation's plan today, so the separation between dev and production is
# kept on the GitHub side: each environment holds its own pair of secrets, and
# Production's are restricted to the branch that deploys it.
#
# Without the credentials the workflow reports what it would have done and
# succeeds, so a fork or a first-time contributor is not blocked by a secret
# they cannot have — and an environment missing one says which one.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

# One deploy at a time per environment, and never cancelled half way: a
# migration interrupted between two statements is the one thing here that
# cannot be retried out of.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  supabase:
    name: Schema and Edge Function
    runs-on: ubuntu-latest
    # Each branch deploys to its own project, with its own secrets. The
    # fallbacks are the two projects this repository has, so a checkout with no
    # variables set still deploys the right one rather than the wrong one.
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      # Belongs to the CI account, which holds the Developer role and nothing more.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # A Postgres connection string. Migrations go straight to the database, so
      # this credential can deploy nothing and the one above can read nothing.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: >-
        ${{ vars.SUPABASE_PROJECT_REF
            || (github.ref_name == 'main' && 'kbybnveitlxkffqptvqm'
                                          || 'rhwkoodeeqyuwfymxwqa') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci

      - name: Rebuild the Edge Function bundle
        run: npm run build:api

      # The deployed artifact is committed, and the Edge Function is deployed by
      # pinning its commit. A drift here means main would deploy code that is
      # not in main.
      - name: Refuse to deploy a stale bundle
        run: |
          if ! git diff --quiet -- supabase/functions/api/index.js; then
            echo "::error::The committed bundle is not the build of services/api/src."
            exit 1
          fi

      # Asked about separately, because they are separate credentials doing
      # separate jobs: one of them missing must not silently skip the other.
      - name: Check for credentials
        id: credentials
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            echo "database=true" >> "$GITHUB_OUTPUT"
          else
            echo "database=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No SUPABASE_DB_URL; skipping the migrations."
          fi
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "functions=true" >> "$GITHUB_OUTPUT"
          else
            echo "functions=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No SUPABASE_ACCESS_TOKEN; skipping the Edge Function."
          fi

      - uses: supabase/setup-cli@v1
        if: steps.credentials.outputs.database == 'true' || steps.credentials.outputs.functions == 'true'
        with:
          version: latest

      # Straight to the database, with no Management API in the path — which is
      # why this needs no access token and can reach nothing but this schema.
      # Give it the session-mode pooler string: runners are IPv4, and a
      # project's direct host may not be.
      - name: Apply migrations
        if: steps.credentials.outputs.database == 'true'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all

      - name: Deploy the Edge Function
        if: steps.credentials.outputs.functions == 'true'
        # ADR 0004 and ADR 0007: the function authenticates its own callers, so
        # the platform's JWT gate is off and this flag is deliberate.
        run: supabase functions deploy api --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      - name: Check it answers
        if: steps.credentials.outputs.functions == 'true'
        run: |
          for attempt in $(seq 1 20); do
            if curl -sf "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/api/health"; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::The deployed function did not answer /health."
          exit 1
